[package]
name = "scarp-studio"
version = "0.0.2-alpha.1"
description = "A native IDE dedicated to Scarp"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "scarp_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

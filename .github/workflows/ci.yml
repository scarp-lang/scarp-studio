name: Scarp Studio CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not build both push and PR runs for each feature-branch commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows editor checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Resolve strictly from reviewed, committed lockfiles.
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend production bundle
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Native Rust compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust service tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Verify official Scarp CLI compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/scarp-lang/scarp/releases/download/v0.0.6-alpha.10/scarp-0.0.6-alpha.10-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile scarp-compiler.zip
          $actual = (Get-FileHash scarp-compiler.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "02da845a634ff3f05e9592f41195c84e9d6f62089f35be44a3c9b41296550190") {
            throw "Official compiler archive hash mismatch"
          }
          Expand-Archive -Path scarp-compiler.zip -DestinationPath scarp-compiler
          $binary = Get-ChildItem scarp-compiler -File -Recurse -Filter "scarp.exe" | Select-Object -First 1
          if (-not $binary) { throw "Official Scarp binary missing from archive" }
          $reportedVersion = & $binary.FullName --version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -ne "scarp 0.0.6-alpha.10") {
            throw "Unexpected Scarp compiler version"
          }
          & $binary.FullName guide exec
          if ($LASTEXITCODE -ne 0) { throw "Scarp exec probe failed" }
          & $binary.FullName guide verify
          if ($LASTEXITCODE -ne 0) { throw "Scarp verify probe failed" }
          'assert(2 + 2 == 4, "Studio alpha.10 smoke"); print("Studio CLI smoke");' | Set-Content -Path scarp-smoke.srp -Encoding utf8
          & $binary.FullName verify --diagnostic-format=json -- scarp-smoke.srp
          if ($LASTEXITCODE -ne 0) { throw "Scarp static verification failed" }
          $execution = & $binary.FullName exec --max-steps 200000 --max-prints 1000 --diagnostic-format=json -- scarp-smoke.srp
          if ($LASTEXITCODE -ne 0 -or $execution -notmatch "Studio CLI smoke") { throw "Scarp execution smoke failed" }
          'bind name = input("Name? "); print("Hello", name);' | Set-Content -Path scarp-prompt.srp -Encoding utf8
          $promptOutput = 'Studio' | & $binary.FullName exec --interactive --diagnostic-format=json -- scarp-prompt.srp
          if ($LASTEXITCODE -ne 0 -or $promptOutput -notmatch "Hello Studio") {
            throw "Scarp alpha.10 preloaded prompt smoke failed"
          }
          'bind numbers: array<integer, 2> = [array: 10, 20]; print(numbers[1]);' | Set-Content -Path scarp-arrays.srp -Encoding utf8
          & $binary.FullName verify --diagnostic-format=json -- scarp-arrays.srp
          if ($LASTEXITCODE -ne 0) { throw "Scarp alpha.10 arrays verify smoke failed" }
          $arrayOutput = & $binary.FullName exec --diagnostic-format=json -- scarp-arrays.srp
          if ($LASTEXITCODE -ne 0 -or $arrayOutput -notmatch "20") {
            throw "Scarp alpha.10 arrays execution smoke failed"
          }
          'bind a = bigint("120"); bind b = bigint("18"); print(bigint_gcd(a, b));' | Set-Content -Path scarp-bigmath.srp -Encoding utf8
          & $binary.FullName verify --diagnostic-format=json -- scarp-bigmath.srp
          if ($LASTEXITCODE -ne 0) { throw "Scarp alpha.10 BigInt verify smoke failed" }
          $bigmathOutput = & $binary.FullName exec --diagnostic-format=json -- scarp-bigmath.srp
          if ($LASTEXITCODE -ne 0 -or $bigmathOutput -notmatch "6") {
            throw "Scarp alpha.10 BigInt execution smoke failed"
          }

      - name: Smoke official Scarp project commands
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Get-ChildItem scarp-compiler -File -Recurse -Filter "scarp.exe" | Select-Object -First 1
          if (-not $binary) { throw "Pinned Scarp compiler missing" }
          & $binary.FullName init studio-project-smoke
          if ($LASTEXITCODE -ne 0) { throw "Scarp init project failed" }
          & $binary.FullName project info --json studio-project-smoke
          if ($LASTEXITCODE -ne 0) { throw "Scarp project info failed" }
          & $binary.FullName verify --diagnostic-format=json -- studio-project-smoke
          if ($LASTEXITCODE -ne 0) { throw "Scarp project verify failed" }
          $defaultRun = & $binary.FullName run --max-input-line-bytes 4096 --max-input-bytes 16384 --max-input-reads 256 --diagnostic-format=json -- studio-project-smoke
          if ($LASTEXITCODE -ne 0) { throw "Scarp project entrypoint run failed" }
          'bind name = input("Name? "); print("Hello", name);' | Set-Content -Path studio-project-smoke/src/main.srp -Encoding utf8
          $interactiveRun = 'Studio' | & $binary.FullName run --max-input-line-bytes 4096 --max-input-bytes 16384 --max-input-reads 256 --diagnostic-format=json --interactive -- studio-project-smoke
          if ($LASTEXITCODE -ne 0 -or $interactiveRun -notmatch "Hello Studio") {
            throw "Scarp project alpha.10 interactive Run smoke failed"
          }
          New-Item -ItemType Directory -Force studio-project-smoke/tests | Out-Null
          'assert(2 + 2 == 4);' | Set-Content -Path studio-project-smoke/tests/check.srp -Encoding utf8
          & $binary.FullName test --list -- studio-project-smoke
          if ($LASTEXITCODE -ne 0) { throw "Scarp list project tests failed" }
          & $binary.FullName test --require-tests -- studio-project-smoke
          if ($LASTEXITCODE -ne 0) { throw "Scarp run project tests failed" }

      - name: Test Studio native process service against pinned Scarp compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Get-ChildItem scarp-compiler -File -Recurse -Filter "scarp.exe" | Select-Object -First 1
          if (-not $binary) { throw "Pinned Scarp compiler missing from integration test" }
          $env:SCARP_TEST_BIN = $binary.FullName
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --ignored --exact compiler::tests::official_compiler_runs_through_native_service --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Native Scarp process integration failed" }
      - name: Build Windows executable
        run: npm run tauri build -- --no-bundle
      - name: Build Windows NSIS installer candidate
        run: npm run tauri build -- --bundles nsis
      - name: Produce SHA-256 checksums
        shell: pwsh
        run: |
          $files = @("src-tauri/target/release/scarp-studio.exe")
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -File -Filter "*-setup.exe")
          if ($installers.Count -eq 0) { throw "Windows installer was not produced" }
          foreach ($installer in $installers) { $files += $installer.FullName }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            "$hash *$(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: scarp-studio-windows-unbundled
          path: src-tauri/target/release/scarp-studio.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: scarp-studio-windows-nsis-candidate
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: scarp-studio-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Ensure builds did not modify dependency lockfiles
        shell: bash
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

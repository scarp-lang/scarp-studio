name: Publish editor-only v0.0.1-alpha.2

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish-editor-alpha2.yml

permissions:
  contents: write

concurrency:
  group: scarp-studio-editor-alpha2-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish unsigned Windows editor alpha
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved version and avoid duplicate release
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '0.0.1-alpha.2'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $npmLock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoLock = Get-Content src-tauri/Cargo.lock -Raw
          if ($pkg.version -ne $expected) {
            'ready=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'Another version is checked out; this one-time release workflow is inert.'
            exit 0
          }
          # Read the manifest versions as data rather than relying on CRLF-
          # sensitive regex anchors on Windows checkouts.
          $cargoVersion = ([regex]::Match(
            $cargo, '(?m)^\s*version\s*=\s*"([^"]+)"'
          )).Groups[1].Value
          $cargoLockVersion = ([regex]::Match(
            $cargoLock, '(?s)\[\[package\]\]\s*name\s*=\s*"scarp-studio"\s*version\s*=\s*"([^"]+)"'
          )).Groups[1].Value
          $versions = [ordered]@{
            npm = $pkg.version
            npm_lock = $npmLock['version']
            npm_root = $npmLock['packages']['']['version']
            tauri = $tauri.version
            cargo = $cargoVersion
            cargo_lock = $cargoLockVersion
          }
          foreach ($item in $versions.GetEnumerator()) {
            Write-Host ("Checking {0}: {1}" -f $item.Key, $item.Value)
            if ($item.Value -ne $expected) {
              throw ("Refusing to publish: {0} version disagrees with {1}." -f $item.Key, $expected)
            }
          }
          $existing = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          if (@($existing.tagName) -contains 'v0.0.1-alpha.2') {
            'ready=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'Version already published; refusing to publish again.'
          } else {
            'ready=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          workspaces: src-tauri
      - name: Install pinned dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        if: steps.gate.outputs.ready == 'true'
        run: npm run typecheck
      - name: Frontend unit tests
        if: steps.gate.outputs.ready == 'true'
        run: npm test
      - name: Frontend production build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build
      - name: Rust formatting
        if: steps.gate.outputs.ready == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust locked compilation
        if: steps.gate.outputs.ready == 'true'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        if: steps.gate.outputs.ready == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows executable
        if: steps.gate.outputs.ready == 'true'
        run: npm run tauri build -- --no-bundle
      - name: Build Windows NSIS installer
        if: steps.gate.outputs.ready == 'true'
        run: npm run tauri build -- --bundles nsis
      - name: Produce release SHA-256 manifest and verify lockfiles
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/scarp-studio.exe'
          $installers = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -File -Filter '*-setup.exe')
          if (-not (Test-Path $exe) -or $installers.Count -ne 1) {
            throw 'Expected a Windows executable and exactly one NSIS installer.'
          }
          $files = @($exe, $installers[0].FullName)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            "$hash *$(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency lockfiles changed during build.' }
      - name: Publish requested editor-only experimental pre-release
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Installer missing or ambiguous.' }
          $arguments = @(
            'create', 'v0.0.1-alpha.2',
            'src-tauri/target/release/scarp-studio.exe',
            $installers[0].FullName, 'SHA256SUMS.txt',
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', 'Scarp Studio v0.0.1-alpha.2 - experimental Windows editor',
            '--notes-file', '.github/release-notes/v0.0.1-alpha.2.md',
            '--prerelease'
          )
          & gh release @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

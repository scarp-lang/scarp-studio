name: Publish authorized Scarp Studio v0.0.1-alpha.1
on:
  push:
    branches: [ops/publish-v0.0.1-alpha.1]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-scarp-studio-v0.0.1-alpha.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'scarp-lang/scarp-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed source and successful CI provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=f6ec706954b6c85df6a407dc89603405e48b55ec
          ci_sha=332c4537db9174fd984c8967276c6d70c77daaad
          ci_run=42994241509
          actual_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$actual_main" = "$main_sha"
          actual_ci_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" --jq '.head_sha')
          test "$actual_ci_sha" = "$ci_sha"
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" --jq '.conclusion')
          test "$conclusion" = success
          main_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$main_sha" --jq '.tree.sha')
          ci_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$ci_sha" --jq '.tree.sha')
          test "$main_tree" = "$ci_tree"
          if gh release view v0.0.1-alpha.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite or duplicate it.'
            exit 1
          fi
      - name: Download verified Windows executable and installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 42994241509 --repo "$GITHUB_REPOSITORY" --name scarp-studio-windows-unbundled --dir dist
          gh run download 42994241509 --repo "$GITHUB_REPOSITORY" --name scarp-studio-windows-nsis-candidate --dir dist
      - name: Verify binary digests against CI-generated manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SHA256SUMS.txt
          test "$(find dist -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 2
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Publish the first experimental GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          ## Scarp Studio v0.0.1-alpha.1 — Windows editor foundation

          This is the **first experimental pre-release**, not a stable IDE.

          **Implemented:** Scarp-only `.srp` editing with Monaco, syntax highlighting, tabs, file open/save/save-as, dirty indicators, unsaved-change prompts, top-level Scarp folder browsing, keyboard shortcuts and light/dark themes. The native desktop shell uses Tauri 2 and Rust.

          **Not yet included:** built-in Run, Verify, compiler diagnostics, language-server features, debugging, interactive terminal, recursive workspace explorer or macOS/Linux installers. Compiler integration is under development separately in PR #5.

          **Testing:** Windows CI passed TypeScript checks, frontend tests, Rust compilation, Windows executable and NSIS installer build. Artifact checksums were matched against the CI manifest. The exact PR source tree is identical to the merge commit tagged by this release.

          **Important limitations:** This unsigned Windows x64 build has **not yet completed hands-on Windows 11 GUI smoke testing** of installation, save/reopen, discard prompts and folder permission scopes. Use test `.srp` files, keep independent backups, and report any failures before relying on the IDE for important work. Windows may show unsigned-publisher warnings. The standalone executable requires normal Tauri/WebView2 runtime prerequisites.

          Source PR: https://github.com/scarp-lang/scarp-studio/pull/1
          Windows build: https://github.com/scarp-lang/scarp-studio/actions/runs/42994241509
          Manual validation checklist: https://github.com/scarp-lang/scarp-studio/issues/2
          NOTES
          gh release create v0.0.1-alpha.1 dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target f6ec706954b6c85df6a407dc89603405e48b55ec \
            --title 'Scarp Studio v0.0.1-alpha.1 (Windows editor alpha)' \
            --notes-file RELEASE_NOTES.md --prerelease
          gh release view v0.0.1-alpha.1 --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease --jq '.'

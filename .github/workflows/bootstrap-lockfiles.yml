name: Bootstrap Scarp Studio dependency lockfiles
on:
  push:
    branches: [feat/initial-editor-foundation]

permissions:
  contents: write
  actions: read

jobs:
  import-verified-lockfiles:
    if: github.repository == 'scarp-lang/scarp-studio' && github.ref == 'refs/heads/feat/initial-editor-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-editor-foundation
      - name: Confirm artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=54f18ae372877ccdc2a11a32967e212f897ba8c5
          actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42981950322" --jq '.head_sha')
          test "$actual" = "$expected"
      - name: Import lockfiles from successful Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42981950322 --repo "$GITHUB_REPOSITORY" --name scarp-studio-lockfiles --dir .
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
      - name: Commit only the two dependency lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles are already present and unchanged.'
            exit 0
          fi
          git commit -m 'build: lock verified frontend and Rust dependencies'
          git push origin HEAD:feat/initial-editor-foundation
